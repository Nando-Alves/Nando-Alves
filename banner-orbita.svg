<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Fernando Alves - Engenheiro de Software - Fundador da Dev Digital">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="1" stop-color="#0a2a38"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.6" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typing">
      <rect x="76" y="166" height="40" width="0">
        <animate attributeName="width" dur="9s" repeatCount="indefinite"
                 values="0;590;590;0" keyTimes="0;0.45;0.9;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1100" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1100" height="340" rx="22" fill="url(#grid)"/>

  <!-- ===== lado esquerdo ===== -->
  <text x="74" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1" opacity="0">
    Fernando Alves
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <g clip-path="url(#typing)">
    <text x="76" y="192" font-family="Consolas,'Fira Code','Courier New',monospace" font-size="19" fill="#67e8f9"
          textLength="590" lengthAdjust="spacing">&gt; Engenheiro de Software  |  Fundador da Dev Digital</text>
  </g>
  <rect y="172" width="3" height="26" fill="#34d399">
    <animate attributeName="x" dur="9s" repeatCount="indefinite" values="76;666;666;76" keyTimes="0;0.45;0.9;1"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Consolas,'Fira Code','Courier New',monospace" font-size="15" fill="#a5f3fc" text-anchor="middle">
    <g opacity="0">
      <rect x="76" y="236" width="84" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="118" y="257">Python</text>
      <animate attributeName="opacity" values="0;1" begin="1s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="172" y="236" width="90" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="217" y="257">Node.js</text>
      <animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="274" y="236" width="70" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="309" y="257">APIs</text>
      <animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="356" y="236" width="118" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="415" y="257">Automação</text>
      <animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.6s" fill="freeze"/>
    </g>
  </g>

  <!-- ===== sistema solar (centro 905,170) ===== -->
  <circle cx="905" cy="170" r="95" fill="url(#sun)">
    <animate attributeName="r" values="88;104;88" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- orbitas -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1">
    <circle cx="905" cy="170" r="46"/>
    <circle cx="905" cy="170" r="80"/>
    <circle cx="905" cy="170" r="114"/>
    <circle cx="905" cy="170" r="148"/>
  </g>

  <!-- bolas verdes: dados em transmissao (passam por tras do planeta) -->
  <g>
    <circle r="3" fill="#34d399">
      <animateMotion dur="6s" begin="-5.5000s" repeatCount="indefinite" path="M951,170 a46,46 0 1,1 -92,0 a46,46 0 1,1 92,0"/>
    </circle>
    <circle r="3" fill="#34d399">
      <animateMotion dur="10s" begin="-1.0000s" repeatCount="indefinite" path="M985,170 a80,80 0 1,1 -160,0 a80,80 0 1,1 160,0"/>
    </circle>
    <circle r="3" fill="#34d399">
      <animateMotion dur="12s" begin="-6.6000s" repeatCount="indefinite" path="M1019,170 a114,114 0 1,1 -228,0 a114,114 0 1,1 228,0"/>
    </circle>
    <circle r="3" fill="#34d399">
      <animateMotion dur="15s" begin="-4.5000s" repeatCount="indefinite" path="M1053,170 a148,148 0 1,1 -296,0 a148,148 0 1,1 296,0"/>
    </circle>
  </g>

