        <animate attributeName="r" dur="60s" repeatCount="indefinite" keyTimes="0.00000;0.17137;0.17720;0.19970;0.20054;0.50470;0.51054;0.53304;0.53387;0.83804;0.84387;0.86637;0.86720;1.00000" values="15;15;16.5;19;15;15;16.5;19;15;15;16.5;19;15;15"/>
