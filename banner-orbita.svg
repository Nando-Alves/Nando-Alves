        <animate attributeName="r" dur="60s" repeatCount="indefinite" keyTimes="0.00000;0.06021;0.06604;0.08854;0.08938;0.39354;0.39938;0.42188;0.42271;0.72688;0.73271;0.75521;0.75604;1.00000" values="15;15;16.5;19;15;15;16.5;19;15;15;16.5;19;15;15"/>
