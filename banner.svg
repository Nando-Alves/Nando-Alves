<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="Fernando Alves - Desenvolvedor Back-end - Dev Digital">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="typing">
      <rect x="76" y="140" height="50" width="0">
        <animate attributeName="width" dur="7s" repeatCount="indefinite"
                 values="0;540;540;0" keyTimes="0;0.45;0.88;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1100" height="300" rx="22" fill="#0c0c0f"/>
  <rect width="1100" height="300" rx="22" fill="url(#dots)"/>

  <!-- linha de destaque -->
  <rect x="76" y="52" width="48" height="4" rx="2" fill="#8b5cf6">
    <animate attributeName="width" values="0;48" dur="1s" fill="freeze"/>
  </rect>

  <!-- nome -->
  <text x="74" y="130" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="#f4f4f5" letter-spacing="-1">
    Fernando Alves
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- subtitulo digitando -->
  <g clip-path="url(#typing)">
    <text x="76" y="172" font-family="Consolas,'Fira Code','Courier New',monospace" font-size="23" fill="#a78bfa"
          textLength="540" lengthAdjust="spacing">Desenvolvedor Back-end  •  Dev Digital</text>
  </g>
  <rect y="150" width="3" height="28" fill="#a78bfa">
    <animate attributeName="x" dur="7s" repeatCount="indefinite"
             values="76;616;616;76" keyTimes="0;0.45;0.88;1"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- detalhe -->
  <text x="76" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#9ca3af">
    Engenharia de Software · Python · Node.js · APIs e Automação
  </text>

  <!-- losangos animados -->
  <g transform="translate(900 150)" fill="none">
    <g>
      <rect x="-95" y="-95" width="190" height="190" stroke="#8b5cf6" stroke-opacity="0.28" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" values="35;395" dur="40s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="-65" y="-65" width="130" height="130" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" values="35;-325" dur="30s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="-25" y="-25" width="50" height="50" stroke="#a78bfa" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </g>
    <circle r="4" fill="#a78bfa">
      <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
