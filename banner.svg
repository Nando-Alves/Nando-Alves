<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="Fernando Alves - Desenvolvedor Back-end - Dev Digital">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="1" stop-color="#0a2a38"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.6" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typing">
      <rect x="76" y="140" height="50" width="0">
        <animate attributeName="width" dur="8s" repeatCount="indefinite"
                 values="0;545;545;0" keyTimes="0;0.45;0.9;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1100" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1100" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="890" cy="150" r="190" fill="url(#glow)"/>

  <!-- etiqueta -->
  <circle cx="82" cy="52" r="5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="98" y="57" font-family="Consolas,'Fira Code','Courier New',monospace" font-size="15" fill="#34d399" letter-spacing="2">
    DEV DIGITAL // ONLINE
  </text>

  <!-- nome -->
  <text x="74" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1" opacity="0">
    Fernando Alves
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- subtitulo digitando -->
  <g clip-path="url(#typing)">
    <text x="76" y="172" font-family="Consolas,'Fira Code','Courier New',monospace" font-size="22" fill="#67e8f9"
          textLength="545" lengthAdjust="spacing">&gt; Desenvolvedor Back-end  |  Dev Digital</text>
  </g>
  <rect y="152" width="3" height="26" fill="#34d399">
    <animate attributeName="x" dur="8s" repeatCount="indefinite" values="76;621;621;76" keyTimes="0;0.45;0.9;1"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- chips -->
  <g font-family="Consolas,'Fira Code','Courier New',monospace" font-size="15" fill="#a5f3fc" text-anchor="middle">
    <g opacity="0">
      <rect x="76" y="205" width="84" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="118" y="226">Python</text>
      <animate attributeName="opacity" values="0;1" begin="1s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="172" y="205" width="90" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="217" y="226">Node.js</text>
      <animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="274" y="205" width="70" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="309" y="226">APIs</text>
      <animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.6s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="356" y="205" width="118" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="415" y="226">Automação</text>
      <animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.6s" fill="freeze"/>
    </g>
  </g>

  <!-- rede de servicos -->
  <g stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5">
    <path d="M890 150 L780 70"/>
    <path d="M890 150 L995 80"/>
    <path d="M890 150 L790 235"/>
    <path d="M890 150 L1000 225"/>
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- pacotes de dados -->
  <g fill="#34d399">
    <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M890 150 L780 70"/></circle>
    <circle r="3.5"><animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" path="M995 80 L890 150"/></circle>
    <circle r="3.5"><animateMotion dur="2.6s" begin="1.1s" repeatCount="indefinite" path="M890 150 L790 235"/></circle>
    <circle r="3.5"><animateMotion dur="3s" begin="0.3s" repeatCount="indefinite" path="M1000 225 L890 150"/></circle>
  </g>

  <!-- satelites -->
  <g font-family="Consolas,'Fira Code','Courier New',monospace" font-size="12" text-anchor="middle" fill="#a5f3fc">
    <g>
      <circle cx="780" cy="70" r="21" fill="#06101d" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="780" y="74">DB</text>
    </g>
    <g>
      <circle cx="995" cy="80" r="21" fill="#06101d" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="995" y="84">WEB</text>
    </g>
    <g>
      <circle cx="790" cy="235" r="21" fill="#06101d" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="790" y="239">BOT</text>
    </g>
    <g>
      <circle cx="1000" cy="225" r="21" fill="#06101d" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="1000" y="229">CLOUD</text>
    </g>
  </g>

  <!-- hub central -->
  <circle cx="890" cy="150" r="28" fill="none" stroke="#34d399" stroke-width="1.5">
    <animate attributeName="r" values="28;58" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="890" cy="150" r="30" fill="#06101d" stroke="#34d399" stroke-width="2"/>
  <text x="890" y="155" font-family="Consolas,'Fira Code','Courier New',monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#34d399">API</text>
</svg>
